[package]
name = "toolbox"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tested code AMAL asks for: capabilities, the Python app's (0.16) tool shelf, skills - run, checked, remembered"

# its own workspace: AMAL keeps it inside its checkout (harness_data/toolbox), whose Cargo workspace is not this one
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
strip = true
