[package]
name = "toolbox"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tested code LOKI asks for: capabilities, LOKI 16's tool shelf, skills - run, checked, remembered"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
strip = true
